# Jarvis local AI pipeline — llama-swap runtime.
# Runs on RTX 3090 24GB which also drives the desktop (Hyprland): the GPU is shared,
# so only one model is resident at a time. The routing.router.settings.groups.default
# group enforces that (swap: true = one model, exclusive: true = everything else unloads).
#
# Address layout:
#   llama-swap :8000  (the only thing opencode/pi/scripts need to know)
#     planner/27B    -> upstream :8081
#     coder/30B-MoE  -> upstream :8082
#     ocr-vlm/27B    -> upstream :8083
#
# Model roles (asked for when the model id / alias appears in a request):
#   planner      deep reasoning, spec + review authority (the "thinker")
#   critic       same weights as planner, but medium reasoning (verify, do not build)
#   coder        Qwen3-Coder-30B-A3B, cheap+fast execution, some thinking
#   ocr-vlm      Qwen3.8-27B + mmproj vision projector for image/layout OCR
#   ocr-review   same weights as planner, minimal reasoning (reparse OCR garble)
#   q38-27b-q5   legacy id -> planner weights (keeps old scripts/probe working)
#   turbo        DavidAU TURBO tune, MTP self-speculation, the fast reasoner
#
# Retuned 2026-09-20 for the RTX 3090 24 GB (the -ncmoe values were sized for the
# 16 GB card): q38-q2 42 -> 30, q38-iq3x 42 -> 32. Both were leaving ~11 GB of the
# card unused. One step further OOMs in each case. Numbers and method in
# docs/evals/benchmark-2026-09-20-all.md.

healthCheckTimeout: 500
globalTTL: 0
logLevel: info
logTimeFormat: rfc3339
store:
  path: /home/ocino/.local/state/llama-swap/activity.sqlite

macros:
  llama: /home/ocino/llama.cpp/build-3090/bin/llama-server
  models: /home/ocino/models-27b
  coder: /mnt/models2/coder
  state: /home/ocino/.local/state/llama-swap
  # shared baseline: full GPU offload, q8_0 KV, no cuda graphs (proven unstable here).
  #
  # -ngl is pinned and -c is deliberately NOT set anywhere: --fit only adjusts
  # arguments the config leaves unset, so this combination makes it pick the largest
  # context that still keeps every layer on the GPU, per model, automatically. Setting
  # both (as this config used to) made --fit abort and did nothing at all. Models with
  # an MTP draft head override --fit-target, because their draft context is allocated
  # after --fit has finished measuring.
  common: >-
    -ngl 99
    --jinja
    -fa on
    -ctk q8_0 -ctv q8_0
    --fit on --fit-target 1024
    --parallel 1
    -t 24
    --host 127.0.0.1

models:
  "planner":
    name: "Qwen3.8-27B (thunker/planner)"
    description: "Qwen3.8-27B dense, deep reasoning. Architecture, root-cause, verification."
    cmd: >-
      ${llama}
      -m ${models}/Qwen3.8-27B-UD-Q5_K_XL.gguf
      ${common}
      --reasoning-format deepseek
      --reasoning-preserve
      --reasoning-budget 800
      --log-file ${state}/planner.log
      --log-timestamps
      --port 8081
    proxy: http://127.0.0.1:8081
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    aliases:
      - planner
      - critic
      - ocr-review
      - planner:fast
      - critic:fast
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 101632
    filters:
      setParamsByID:
        planner:
          reasoning_effort: low
          temperature: 0.2
        "planner:fast":
          reasoning_effort: none
          temperature: 0.0
        critic:
          reasoning_effort: low
          temperature: 0.2
        "critic:fast":
          reasoning_effort: none
          temperature: 0.0
        ocr-review:
          reasoning_effort: none
          temperature: 0.0

  "q38-27b-q5":
    name: "Qwen3.8-27B UD-Q5_K_XL (legacy)"
    description: "Same weights as planner under the old model-script key so nothing breaks."
    cmd: >-
      ${llama}
      -m ${models}/Qwen3.8-27B-UD-Q5_K_XL.gguf
      ${common}
      --log-file ${state}/q38-27b-q5.log
      --log-timestamps
      --port 8084
    proxy: http://127.0.0.1:8084
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 101632

  "qwen3-coder-30b":
    name: "Qwen3-Coder-30B-A3B (executor)"
    description: "MoE 30B/3B active coding model. Executes specs, no deep thinking unless asked."
    cmd: >-
      ${llama}
      -m ${coder}/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      ${common}
      --reasoning off
      --log-file ${state}/qwen3-coder-30b.log
      --log-timestamps
      --port 8082
    proxy: http://127.0.0.1:8082
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    aliases:
      - coder
      - qwen3-coder-30b:fast
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 99584
    filters:
      setParamsByID:
        coder:
          reasoning_effort: medium
        "qwen3-coder-30b:fast":
          reasoning_effort: none

  "ocr-vlm":
    name: "Qwen3.8-27B VLM (OCR specialist)"
    description: "27B IQ4 + mmproj vision projector for scans, layout and table OCR."
    cmd: >-
      ${llama}
      -m ${models}/Qwen3.8-27B-UD-IQ4_XS.gguf
      -mm ${models}/mmproj-F16.gguf
      ${common}
      --reasoning off
      --log-file ${state}/ocr-vlm.log
      --log-timestamps
      --port 8083
    proxy: http://127.0.0.1:8083
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text, image]
      out: [text]
      context: 225536
    filters:
      setParamsByID:
        "ocr-vlm:fast":
          temperature: 0.0

  "q38-q2":
    name: "Qwen3.8-Flash-Next UD-Q2_K_XL (fallback/eval)"
    description: "Big MoE, experts spill to RAM. Kept for evals and the voice fallback path."
    cmd: >-
      ${llama}
      -m /mnt/models2/UD-Q2_K_XL/Qwen3.8-Flash-Next-UD-Q2_K_XL-00001-of-00003.gguf
      ${common}
      -ncmoe 42
      --reasoning-effort low
      --log-file ${state}/q38-q2.log
      --log-timestamps
      --port 8085
    proxy: http://127.0.0.1:8085
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      context: 262144

  "q38-iq3x":
    name: "Qwen3.8-Flash-Next UD-IQ3_XXS (deep planner)"
    description: "Big MoE 76GB, mostly RAM-resident. Local planner-deep: najviac vedomosti, ktore vlezu lokálne."
    cmd: >-
      ${llama}
      -m /mnt/models2/UD-IQ3_XXS/Qwen3.8-Flash-Next-UD-IQ3_XXS-00001-of-00003.gguf
      ${common}
      -ncmoe 32
      --reasoning-effort low
      --reasoning-budget 800
      --log-file ${state}/q38-iq3x.log
      --log-timestamps
      --port 8087
    proxy: http://127.0.0.1:8087
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      context: 124416
    aliases:
      - planner-deep
    filters:
      setParamsByID:
        planner-deep:
          reasoning_effort: low
          temperature: 0.2

  "dsv4-q8":
    name: "DeepSeek-V4-Flash UD-Q8_K_XL (eval)"
    description: "Local 284B/13B-active MoE, Q8, experts spill to RAM. 3-4 tok/s — eval only."
    cmd: >-
      ${llama}
      -m /mnt/models2/deepseek-v4/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf
      ${common}
      -ncmoe 43
      --reasoning-format deepseek
      --reasoning-preserve
      --reasoning-budget 800
      --log-file ${state}/dsv4-q8.log
      --log-timestamps
      --port 8086
    proxy: http://127.0.0.1:8086
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 1048576


  # DavidAU TURBO fine-tune of Qwen3.8-27B (NEO di-imatrix Q5_K_M, uncensored).
  # MTP quant + self-speculation -> ~52 tok/s, draft acceptance 58-77%.
  # Measured 2026-09-20, see docs/evals/benchmark-2026-09-20-turbo.md.
  # The non-MTP file of the same tune was dropped on request; it is still on disk at
  # ~/models-27b/turbo/Q5_K_M.gguf (19.3 GiB) if it is ever wanted back.
  #
  # The tune's template defaults to reasoning_effort xhigh. Benchmarked here at
  # low (14/15 checkable tasks) vs off (10/15): off blows multi-step arithmetic,
  # date maths and counting, so low is the default and off lives on ":fast",
  # which is for extraction/formatting, not reasoning.
  #
  # fit-target is 4080 rather than the shared 2704: the MTP draft context is
  # allocated after --fit does its sums and costs ~1.4 GB, so the lower target
  # left only 1.3 GB for the desktop.
  "turbo":
    name: "Qwen3.8-27B TURBO Fable-CF (MTP)"
    description: "DavidAU TURBO tune, Q5_K_M NEO imatrix, uncensored, short thinking blocks. MTP self-speculation, ~52 tok/s."
    cmd: >-
      ${llama}
      -m ${models}/turbo/MTP-Q5_K_M.gguf
      ${common}
      --fit-target 2400
      -c 65536
      --spec-type draft-mtp
      --temp 0.6
      --repeat-penalty 1.0
      --reasoning-format deepseek
      --reasoning-preserve
      --log-file ${state}/turbo.log
      --log-timestamps
      --port 8088
    proxy: http://127.0.0.1:8088
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    aliases:
      - turbo
      - turbo:fast
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 65536
    filters:
      setParamsByID:
        turbo:
          reasoning_effort: low
          temperature: 0.6
        "turbo:fast":
          reasoning_effort: none
          temperature: 0.6

  # --- 27B candidates -------------------------------------------------------
  # These sat on disk unwired since 2026-09-15, so nothing could serve them. All
  # Qwen3.8-27B derivatives: they fit the 24 GB card whole at 32k ctx, and the two
  # with "mtp" in the filename get self-speculation like turbo does.
  "huihui":
    name: "Huihui Qwen3.8 27B abliterated"
    description: "Abliterated 27B — refusals removed. Uncensored general assistant."
    cmd: >-
      ${llama}
      -m /mnt/models2/candidates/huihui-abliterated/Huihui-Qwen3.8-27B-abliterated-UD-Q4_K_XL.gguf
      ${common}
      --reasoning-effort low
      --log-file ${state}/huihui.log
      --log-timestamps
      --port 8090
    proxy: http://127.0.0.1:8090
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    aliases:
      - huihui:fast
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 180992
    filters:
      setParamsByID:
        "huihui:fast":
          reasoning_effort: none

  "heretic":
    name: "Qwen3.8 27B Heretic multilingual"
    description: "Heretic 27B, multilingual MTP quant. Uncensored, tuned for non-English."
    cmd: >-
      ${llama}
      -m /mnt/models2/candidates/0bserverx-heretic/RVN-Q4_K_M-multilingual-mtp.gguf
      ${common}
      --fit-target 2600
      --spec-type draft-mtp
      --reasoning-effort low
      --chat-template-file /home/ocino/jarvis-files/models/templates/qwen38-27b-unsloth.jinja
      --log-file ${state}/heretic.log
      --log-timestamps
      --port 8091
    proxy: http://127.0.0.1:8091
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    aliases:
      - heretic:fast
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 101120
    filters:
      setParamsByID:
        "heretic:fast":
          reasoning_effort: none

  "swift":
    name: "Swift Qwen3.8 27B"
    description: "Swift fine-tune of Qwen3.8-27B, Q4_K_M."
    cmd: >-
      ${llama}
      -m /mnt/models2/candidates/swift/Swift-Qwen3.8-27B-Q4_K_M.gguf
      ${common}
      --reasoning-effort low
      --log-file ${state}/swift.log
      --log-timestamps
      --port 8092
    proxy: http://127.0.0.1:8092
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 171520

  "gsq-rco":
    name: "Qwen3.8 27B GSQ-RCO"
    description: "GSQ-RCO 27B, IQ3_S MTP quant — the smallest 27B here."
    cmd: >-
      ${llama}
      -m /mnt/models2/candidates/gsq-rco/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
