      --fit-target 2600
      --spec-type draft-mtp
      --reasoning-effort low
      --chat-template-file /home/ocino/jarvis-files/models/templates/qwen38-27b-unsloth.jinja
      --log-file ${state}/gsq-rco.log
      --log-timestamps
      --port 8093
    proxy: http://127.0.0.1:8093
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 203264

  # --- the rest of the Flash-Next ladder ------------------------------------
  # 104 GB and 148 GB against 62 GB of RAM: these stream from the Kingston the whole
  # time they run. -ncmoe guessed from the Q2 retune and the size ratio; if either
  # OOMs, raise it.
  "q38-q4":
    name: "Qwen3.8 Flash-Next Q4"
    description: "Flash-Next UD-Q4_K_XL, 104 GB. Mostly disk-resident."
    cmd: >-
      ${llama}
      -m /home/ocino/models-fast/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
      ${common}
      -ncmoe 44
      --reasoning-effort low
      --log-file ${state}/q38-q4.log
      --log-timestamps
      --port 8094
    proxy: http://127.0.0.1:8094
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      context: 262144

  "q38-q5":
    name: "Qwen3.8 Flash-Next Q5"
    description: "Flash-Next UD-Q5_K_XL, 148 GB. Mostly disk-resident."
    cmd: >-
      ${llama}
      -m /home/ocino/models-fast/UD-Q5_K_XL/Qwen3.8-Flash-Next-UD-Q5_K_XL-00001-of-00006.gguf
      ${common}
      -ncmoe 42
      --reasoning-effort low
      --log-file ${state}/q38-q5.log
      --log-timestamps
      --port 8095
    proxy: http://127.0.0.1:8095
    env:
      - "GGML_CUDA_DISABLE_GRAPHS=1"
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      context: 243968

routing:
  router:
    use: group
    settings:
      groups:
        default:
          swap: true
          exclusive: true
          members:
            - planner
            - q38-27b-q5
            - qwen3-coder-30b
            - ocr-vlm
            - q38-q2
            - dsv4-q8
            - q38-iq3x
            - turbo
            - huihui
            - heretic
            - swift
            - gsq-rco
            - q38-q4
            - q38-q5

hooks:
  on_startup:
    preload:
      - planner

# Remote llama-swap instances joined as native peers (llama-swap v242+ peer routing).
# Peer model IDs must match what each instance exposes. Addressable on Jarvis as
# petko/<model> and filipko/<model> (FQN). Plain LAN peering, no tailcat token:
# all three hosts are on 192.168.100.0/24 with firewall rules scoped to that subnet.
#
#   petko   192.168.100.23  executor model  -> Qwen3-14B  Q4_K_M (RTX 5070 12GB)
#   filipko 192.168.100.7   governor model  -> Qwen3-14B  Q6_K   (RTX 5070 Ti 16GB)
peers:
  petko:
    proxy: http://192.168.100.23:8080
    models:
      - executor
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600
      tlsHandshake: 10
      idleConn: 600
  filipko:
    proxy: http://192.168.100.7:8080
    models:
      - governor
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600
      tlsHandshake: 10
      idleConn: 600